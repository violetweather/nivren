name: Fuzz smoke test

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [frontend, binary]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz build ${{ matrix.target }}
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30 -max_len=1048576
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
