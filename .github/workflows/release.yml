name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            binary: niv
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            binary: niv
          - platform: macos-x64
            os: macos-15-intel
            binary: niv
          - platform: macos-arm64
            os: macos-15
            binary: niv
          - platform: windows-x64
            os: windows-2025
            binary: niv.exe
            msvc_arch: x64
          - platform: windows-arm64
            os: windows-11-arm
            binary: niv.exe
            msvc_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Verify release version
        shell: python
        run: |
          import os, pathlib, re, sys
          manifest = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          version = re.search(r'^version = "([^"]+)"', manifest, re.MULTILINE).group(1)
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match package version v{version}")
      - name: Validate Unix installer
        if: runner.os != 'Windows'
        run: |
          sh -n install/install.sh
          sh tools/test_unix_installer.sh
          root="$RUNNER_TEMP/nivren-uninstall-root"
          bin="$RUNNER_TEMP/nivren-uninstall-bin"
          mkdir -p "$root/versions/1/bin" "$bin"
          touch "$root/versions/1/bin/niv"
          ln -s "$root/versions/1/bin/niv" "$bin/niv"
          printf 'nivren-managed-root-v1\n' > "$root/.nivren-install-root"
          sh install/install.sh --uninstall --install-root "$root" --bin-dir "$bin"
          test ! -e "$root"
          test ! -e "$bin/niv"
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $root = Join-Path $env:RUNNER_TEMP "nivren-uninstall-root"
          $bin = Join-Path $root "bin"
          New-Item -ItemType Directory -Force $bin, (Join-Path $root "versions\1.0.0\bin"), (Join-Path $root "versions\2.0.0\bin") | Out-Null
          Copy-Item (Get-Command pwsh).Source (Join-Path $root "versions\1.0.0\bin\niv.exe")
          Copy-Item (Get-Command pwsh).Source (Join-Path $root "versions\2.0.0\bin\niv.exe")
          Set-Content -LiteralPath (Join-Path $root ".nivren-install-root") -Value "nivren-managed-root-v1" -NoNewline
          Set-Content -LiteralPath (Join-Path $root "current-version") -Value "2.0.0" -NoNewline
          Set-Content -LiteralPath (Join-Path $root "previous-version") -Value "1.0.0" -NoNewline
          & "install/install.ps1" -Rollback -InstallRoot $root
          if ((Get-Content -Raw (Join-Path $root "current-version")) -ne "1.0.0") { throw "rollback did not activate the previous version" }
          if ((Get-Content -Raw (Join-Path $root "previous-version")) -ne "2.0.0") { throw "rollback did not preserve the replaced version" }
          if (-not (Test-Path (Join-Path $root "install-receipt.json"))) { throw "rollback receipt is missing" }
          & "install/install.ps1" -Uninstall -InstallRoot $root
          if (Test-Path $root) { throw "uninstaller left its managed root behind" }
          tools/test_windows_installer.ps1
      - name: Test release source
        run: |
          cargo test --workspace --all-targets --locked
          cargo build --release --workspace --locked
          python tools/test_release_packager.py
          python tools/test_verify_release_artifacts.py
      - name: Enforce the 1.0 release policy
        if: startsWith(github.ref_name, 'v1.')
        run: cargo run --locked -- release check .
      - name: Build twice
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export CARGO_TARGET_DIR=target-repro
          cargo build --release --workspace --locked
          cp "target-repro/release/${{ matrix.binary }}" reproducible-first
          mkdir reproducible-libs
          find target-repro/release -maxdepth 1 -type f \( -name 'libnivren_ffi.so' -o -name 'libnivren_ffi.dylib' -o -name 'libnivren_ffi.a' \) -exec cp {} reproducible-libs/ \;
          cargo clean
          cargo build --release --workspace --locked
          cmp reproducible-first "target-repro/release/${{ matrix.binary }}"
          for library in reproducible-libs/*; do cmp "$library" "target-repro/release/$(basename "$library")"; done
          python tools/package_release.py reproducible-first "${RELEASE_LABEL}" "${{ matrix.platform }}" "dist/nivren-${RELEASE_LABEL}-${{ matrix.platform }}.zip" target-repro/release
      - name: Build twice
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --pretty=%ct
          $env:CARGO_TARGET_DIR = "target-repro"
          $env:RUSTFLAGS = "-C link-arg=/Brepro"
          python tools/test_normalize_coff_archive.py
          cargo build --release --workspace --locked
          python tools/normalize_coff_archive.py "target-repro/release/nivren_ffi.lib"
          Copy-Item "target-repro/release/${{ matrix.binary }}" "reproducible-first"
          New-Item -ItemType Directory -Path "reproducible-libs" | Out-Null
          Get-ChildItem "target-repro/release" -File | Where-Object { $_.Name -match 'nivren_ffi.*\.(dll|lib)$' } | Copy-Item -Destination "reproducible-libs"
          cargo clean
          cargo build --release --workspace --locked
          python tools/normalize_coff_archive.py "target-repro/release/nivren_ffi.lib"
          $first = (Get-FileHash "reproducible-first" -Algorithm SHA256).Hash
          $second = (Get-FileHash "target-repro/release/${{ matrix.binary }}" -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "release build is not reproducible" }
          Get-ChildItem "reproducible-libs" -File | ForEach-Object {
            $rebuilt = Join-Path "target-repro/release" $_.Name
            if ((Get-FileHash $_.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $rebuilt -Algorithm SHA256).Hash) { throw "$($_.Name) is not reproducible" }
          }
          python tools/package_release.py reproducible-first "${env:RELEASE_LABEL}" "${{ matrix.platform }}" "dist/nivren-${env:RELEASE_LABEL}-${{ matrix.platform }}.zip" target-repro/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: build (wasm32-wasip1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and verify reproducible WASI and browser modules
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          cargo build -p nivren-wasm --target wasm32-wasip1 --release --locked
          node tools/test_wasm_host.mjs
          cargo build -p nivren-wasm --target wasm32-unknown-unknown --release --locked
          node tools/test_wasm_browser.mjs
          cp target/wasm32-wasip1/release/nivren_wasm.wasm reproducible-first.wasm
          cp target/wasm32-unknown-unknown/release/nivren_wasm.wasm reproducible-browser.wasm
          cargo clean -p nivren-wasm
          cargo build -p nivren-wasm --target wasm32-wasip1 --release --locked
          cargo build -p nivren-wasm --target wasm32-unknown-unknown --release --locked
          cmp reproducible-first.wasm target/wasm32-wasip1/release/nivren_wasm.wasm
          cmp reproducible-browser.wasm target/wasm32-unknown-unknown/release/nivren_wasm.wasm
          mkdir dist
          cp reproducible-first.wasm "dist/nivren-${RELEASE_LABEL}-wasm32-wasip1.wasm"
          cp reproducible-browser.wasm "dist/nivren-${RELEASE_LABEL}-browser.wasm"
          cp sdk/browser/nivren.mjs "dist/nivren-${RELEASE_LABEL}-browser.mjs"
      - uses: actions/upload-artifact@v7
        with:
          name: release-wasm32-wasip1
          path: dist/*
          if-no-files-found: error

  oci:
    name: publish (OCI multi-architecture)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish provenance-bearing OCI indexes
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --name nivren-release --use
          docker buildx build \
            --file containers/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:latest" \
            --push .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Enforce the stable release policy
        if: ${{ !contains(github.ref_name, '-') }}
        run: cargo run --locked -- release check .
      - name: Verify beta release disclosure
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          grep -F "Product Proof is not complete" docs/RELEASES.md
          grep -F "prerelease" docs/RELEASES.md
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: downloaded
          merge-multiple: false
      - name: Collect release archives
        run: |
          mkdir -p release-assets
          find downloaded -type f -name 'nivren-*.zip' -exec cp {} release-assets/ \;
          find downloaded -type f -name 'nivren-*.wasm' -exec cp {} release-assets/ \;
          find downloaded -type f -name 'nivren-*-browser.mjs' -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name 'nivren-*.zip' | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name 'nivren-*.wasm' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'nivren-*-browser.mjs' | wc -l)" -eq 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          cp nivren-*.vsix ../../release-assets/
      - name: Write checksums
        working-directory: release-assets
        run: sha256sum nivren-* > SHA256SUMS
      - name: Verify the complete release set
        run: python tools/verify_release_artifacts.py release-assets "${RELEASE_LABEL}"
      - name: Sign release provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes)
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" release-assets/* "${release_flags[@]}"
