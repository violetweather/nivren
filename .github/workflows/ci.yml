name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
            msvc_arch: x64
          - platform: windows-arm64
            os: windows-11-arm
            msvc_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --workspace --release --locked
      - name: Validate Windows signed-channel installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test_windows_installer.ps1
      - run: python tools/test_mobile_sdk.py
      - run: python tools/test_release_packager.py
      - run: cargo run --locked -- test
      - run: cargo run --locked -- check examples/getting_started.niv
      - run: cargo run --locked -- run examples/getting_started.niv
      - run: cargo run --locked -- build examples/project
      - run: cargo run --locked -- check examples/project/target/hello-modules.nivb
      - run: cargo run --locked -- run examples/project/target/hello-modules.nivb
      - run: cargo run --locked -- test
        env:
          NIVREN_GC_STRESS: "1"

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run compile
      - run: npm run package

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo bench --bench performance --locked
        env:
          NIVREN_BENCH_GATE: "1"
      - run: cargo bench --bench compiler_proof --locked
        env:
          NIVREN_COMPILER_BENCH_GATE: "1"
      - run: cargo build --release --bin niv --locked
      - run: node tools/compiler_proof_app_gate.mjs

  compiler-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer native compiler proof
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:symbolize=1
        run: |
          symbolizer="$(command -v llvm-symbolizer-18)"
          test -x "$symbolizer"
          ASAN_SYMBOLIZER_PATH="$symbolizer" cargo test --target x86_64-unknown-linux-gnu --test compiler_proof --locked
      - name: Valgrind native CLI execution
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo build --bin niv --locked
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            target/debug/niv run --native proofs/edition4/intent_snapshot.niv

  wasm:
    name: WebAssembly host and guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo clippy -p nivren-wasm --target wasm32-wasip1 --locked -- -D warnings
      - run: cargo build -p nivren-wasm --target wasm32-wasip1 --release --locked
      - run: node tools/test_wasm_host.mjs
      - run: cargo build -p nivren-wasm --target wasm32-unknown-unknown --release --locked
      - run: node tools/test_wasm_browser.mjs

  container:
    name: OCI container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag nivren-ci --file containers/Dockerfile .
      - run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m nivren-ci version
