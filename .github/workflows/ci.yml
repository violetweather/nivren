name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python tools/test_release_packager.py
      - run: cargo run --locked -- test
      - run: cargo run --locked -- check examples/getting_started.niv
      - run: cargo run --locked -- run examples/getting_started.niv
      - run: cargo run --locked -- build examples/project
      - run: cargo run --locked -- check examples/project/target/hello-modules.nivb
      - run: cargo run --locked -- run examples/project/target/hello-modules.nivb
      - run: cargo run --locked -- test
        env:
          NIVREN_GC_STRESS: "1"

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run compile
      - run: npm run package

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo bench --bench performance --locked
        env:
          NIVREN_BENCH_GATE: "1"
