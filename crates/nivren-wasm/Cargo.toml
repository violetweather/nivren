[package]
name = "nivren-wasm"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Portable WebAssembly compiler and runtime ABI for Nivren"
repository = "https://github.com/violetweather/nivren"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nivren = { path = "../..", default-features = false, features = ["portable-runtime"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
