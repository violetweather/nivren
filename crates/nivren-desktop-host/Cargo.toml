[package]
name = "nivren-desktop-host"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bounded system-webview desktop host adapter for Nivren (Windows WebView2 first)"
repository = "https://github.com/violetweather/nivren"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
wry = "0.47"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
