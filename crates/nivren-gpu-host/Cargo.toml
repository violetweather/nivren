[package]
name = "nivren-gpu-host"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bounded WebGPU compute host adapter for Nivren"
repository = "https://github.com/violetweather/nivren"

[dependencies]
pollster = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
