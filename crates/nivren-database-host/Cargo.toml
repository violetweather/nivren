[package]
name = "nivren-database-host"
version = "0.10.0-beta.6"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bounded SQLite host adapter for Nivren Edition 4"
repository = "https://github.com/violetweather/nivren"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
