[package]
name = "nivren-database-host"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Bounded SQLite, PostgreSQL, and MySQL host adapter for Nivren"
repository = "https://github.com/violetweather/nivren"

[dependencies]
mysql = { version = "26.0.1", default-features = false, features = ["minimal"] }
postgres = "0.19.10"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
