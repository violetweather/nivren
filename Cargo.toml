[package]
name = "nivren"
version = "0.10.0-beta.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "The Nivren programming language"
repository = "https://github.com/violetweather/nivren"

[dependencies]
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
webpki-roots = "1.0.9"
nivren-jit = { path = "crates/nivren-jit" }
ed25519-dalek = "=3.0.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"

[lib]
name = "nivren"
path = "src/lib.rs"

[[bin]]
name = "niv"
path = "src/main.rs"

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
members = ["crates/nivren-ffi", "crates/nivren-jit"]
exclude = ["fuzz"]
resolver = "3"
